<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Mengunci skala layar HP agar tidak bergeser atau nge-zoom secara tidak sengaja -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Anglerfish Game - Full Source</title>
    <style>
        body {
            margin: 0;
            background-color: #030712; /* Suasana kegelapan laut dalam */
            overflow: hidden;
            cursor: none; /* Menyembunyikan kursor asli laptop */
            overscroll-behavior: none; /* Mencegah pull-to-refresh di Chrome Android */
            touch-action: none; /* Mematikan gesture bawaan browser agar geseran jari mulus */
            font-family: sans-serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
        #score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #4cc9f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(76, 201, 240, 0.6);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Papan Skor -->
    <div id="score-board">MAKANAN DIMAKAN: <span id="score">0</span> | UKURAN: <span id="size-text">100%</span></div>
    
    <!-- Area Gambar Animasi -->
    <canvas id="fishCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const sizeTextElement = document.getElementById('size-text');

        // Menyesuaikan ukuran canvas dengan layar browser secara dinamis
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // === 1. KONFIGURASI DAN VARIABEL UTAMA (BERDASARKAN SCRIPT ANDA) ===
        let FISH_SCALE = 1.0; // Ukuran awal ikan (akan bertambah besar seiring makan)
        let foodsEaten = 0;   // Skor jumlah makanan yang dimakan

        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, velocityX: 0, velocityY: 0 };
        let lastTouchX = window.innerWidth / 2;
        let lastTouchY = window.innerHeight / 2;
        let biteTimer = 0;

        // Struktur Segmen Tulang Belakang (Logika Meliuk / Inverse Kinematics)
        const numSegments = 18; 
        const segments = [];
        
        for (let i = 0; i < numSegments; i++) {
            segments.push({
                x: window.innerWidth / 2 + i * 15,
                y: window.innerHeight / 2,
                angle: 0,
                baseLength: i === 0 ? 25 : 14 // Panjang tulang dasar tiap ruas
            });
        }

        // === 2. SISTEM MAKANAN (FOOD SYSTEM) ===
        const foods = [];
        const maxFoods = 35; // Jumlah maksimal makanan yang tersebar di layar

        function spawnFood() {
            foods.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 3,
                pulse: Math.random() * Math.PI, // Untuk efek kerlip cahaya makanan
                color: `hsl(${Math.random() * 40 + 20}, 100%, 65%)` // Warna kuning/jingga neon bercahaya
            });
        }

        // Mengisi makanan pertama kali saat game dibuka
        for (let i = 0; i < maxFoods; i++) {
            spawnFood();
        }

        // === 3. LOGIKA DETEKSI GERAKAN (DESKTOP & MOBILE ANDROID CHROME) ===
        function handleMove(currentX, currentY) {
            pointer.velocityX = currentX - lastTouchX;
            pointer.velocityY = currentY - lastTouchY;
            lastTouchX = currentX;
            lastTouchY = currentY;

            // Jika digerakkan/digeser cepat, rahang otomatis bersiap menggigit
            if (Math.hypot(pointer.velocityX, pointer.velocityY) > 20) {
                biteTimer = Math.max(biteTimer, 12);
            }
        }

        // Event Pergerakan Mouse di Laptop/PC
        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        // Event Sentuhan Pertama Jari di Layar HP Android
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        }, { passive: true });

        // Event Geseran Jari (Drag) di Layar HP Android
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });


        // === 4. LOOP CORE ANIMASI UTAMA ===
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pergerakan halus pendaran lampu mengikuti kursor atau geseran jari
            pointer.x += (lastTouchX - pointer.x) * 0.12;
            pointer.y += (lastTouchY - pointer.y) * 0.12;

            // --- HITUNGAN MATEMATIKA DARI SKRIP ASLI DI GAMBAR ANDA ---
            const pointerSpeed = Math.hypot(pointer.velocityX, pointer.velocityY);
            const fastMovement = Math.min(Math.max(pointerSpeed - 12, 0) / 16, 1);
            const trailDistance = Math.min(pointerSpeed / 6, 1) * (34 + pointerSpeed * 0.22) * (1 - fastMovement * 0.55);

            if (biteTimer > 0) biteTimer--;

            // --- SISTEM DETEKSI MAKANAN ---
            const headX = segments[0].x;
            const headY = segments[0].y;
            const eatDistance = 35 * FISH_SCALE; // Area mulut membesar sesuai ukuran tubuh

            for (let i = foods.length - 1; i >= 0; i--) {
                const food = foods[i];
                const distToHead = Math.hypot(food.x - headX, food.y - headY);

                // Logika ketika makanan masuk ke area mulut ikan
                if (distToHead < eatDistance) {
                    foods.splice(i, 1); // Hapus makanan yang dimakan
                    foodsEaten++;
                    
                    // Tubuh ikan tumbuh membesar 3% per makanan yang ditelan
                    FISH_SCALE += 0.03; 
                    biteTimer = 22; // Efek mulut membuka lebar saat mengunyah makanan

                    // Perbarui teks papan skor di layar
                    scoreElement.innerText = foodsEaten;
                    sizeTextElement.innerText = Math.round(FISH_SCALE * 100) + "%";

                    spawnFood(); // Memunculkan makanan pengganti di tempat acak lain
                }
            }

            // --- SISTEM HITUNGAN FISIKA MELIUK (INVERSE KINEMATICS) ---
            let targetX = pointer.x;
            let targetY = pointer.y;

            for (let i = 0; i < numSegments; i++) {
                const seg = segments[i];
                const dx = targetX - seg.x;
                const dy = targetY - seg.y;
                
                seg.angle = Math.atan2(dy, dx);
                
                // Menyesuaikan panjang ruas tulang secara real-time berdasarkan pertumbuhan skala
                const currentLength = seg.baseLength * FISH_SCALE;
                seg.x = targetX - Math.cos(seg.angle) * currentLength;
                seg.y = targetY - Math.sin(seg.angle) * currentLength;

                targetX = seg.x;
                targetY = seg.y;
            }

            // === 5. PROSES MENGGAMBAR ELEMEN (RENDER GRAPHICS) ===

            // Menggambar Partikel Makanan Bercahaya
            foods.forEach(food => {
                food.pulse += 0.05;
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = food.color;
                ctx.fillStyle = food.color;
                ctx.beginPath();
                ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Efek Cahaya Lampu Anglerfish (Radial Glow)
            ctx.save();
            const glowGrd = ctx.createRadialGradient(pointer.x, pointer.y, 2, pointer.x, pointer.y, (160 + trailDistance * 2) * FISH_SCALE);
            glowGrd.addColorStop(0, 'rgba(0, 220, 255, 0.85)');
            glowGrd.addColorStop(0.15, 'rgba(0, 150, 255, 0.3)');
            glowGrd.addColorStop(0.5, 'rgba(0, 80, 150, 0.08)');
            glowGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Titik Bola Lampu Inti di Kursor
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 6 * FISH_SCALE, 0, Math.PI * 2);
            ctx.fillStyle = "#e0f7fa";
            ctx.fill();

            // Menggambar Anatomi Tubuh Ikan (Diproses dari Ekor ke Kepala agar tumpukan layernya rapi)
            for (let i = numSegments - 1; i >= 0; i--) {
                const seg = segments[i];
                ctx.save();
                ctx.translate(seg.x, seg.y);
                ctx.rotate(seg.angle);

                ctx.strokeStyle = "rgba(200, 240, 255, 0.45)";
                ctx.fillStyle = "rgba(10, 25, 40, 0.7)";
                ctx.lineWidth = 1.5 * FISH_SCALE; // Ketebalan garis tulang ikut menebal saat membesar

                if (i === 0) {
                    // Antena Pengait Lampu
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(20 * FISH_SCALE, -30 * FISH_SCALE, (25 + trailDistance * 0.2) * FISH_SCALE, -15 * FISH_SCALE);
                    ctx.strokeStyle = "rgba(0, 200, 255, 0.6)";
                    ctx.stroke();

                    // Rahang Atas Kepala
                    
        ctx.beginPath();
        ctx.ellipse(5 * FISH_SCALE, -5 * FISH_SCALE, 20 * FISH_SCALE, 12 * FISH_SCALE, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Rahang Bawah Kepala (Membuka lebar otomatis saat makan atau bergerak cepat)
        ctx.restore();
        ctx.save();
        ctx.translate(seg.x, seg.y);
        
        const biteOpen = biteTimer > 0 ? 0.6 : (0.1 + pointerSpeed * 0.01);
        ctx.rotate(seg.angle + biteOpen);
        
        ctx.beginPath();
        ctx.ellipse(5 * FISH_SCALE, 5 * FISH_SCALE, 22 * FISH_SCALE, 10 * FISH_SCALE, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Susunan Gigi Tajam Transparan
        ctx.fillStyle = "rgba(230, 250, 255, 0.85)";
        ctx.beginPath();
        ctx.moveTo(12 * FISH_SCALE, 2 * FISH_SCALE); 
        ctx.lineTo(15 * FISH_SCALE, 8 * FISH_SCALE); 
        ctx.lineTo(17 * FISH_SCALE, 2 * FISH_SCALE);
        
        ctx.moveTo(4 * FISH_SCALE, 1 * FISH_SCALE); 
        ctx.lineTo(6 * FISH_SCALE, 7 * FISH_SCALE); 
        ctx.lineTo(9 * FISH_SCALE, 1 * FISH_SCALE);
        ctx.fill();
    } 
    else if (i === numSegments - 1) {
        // Sirip Ekor Belakang
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-20 * FISH_SCALE, -25 * FISH_SCALE, -40 * FISH_SCALE, -35 * FISH_SCALE, -45 * FISH_SCALE, -15 * FISH_SCALE);
        ctx.bezierCurveTo(-35 * FISH_SCALE, -5 * FISH_SCALE, -15 * FISH_SCALE, -2 * FISH_SCALE, 0, 0);
        ctx.bezierCurveTo(-15 * FISH_SCALE, 2 * FISH_SCALE, -35 * FISH_SCALE, 5 * FISH_SCALE, -45 * FISH_SCALE, 15 * FISH_SCALE);
        ctx.bezierCurveTo(-40 * FISH_SCALE, 35 * FISH_SCALE, -20 * FISH_SCALE, 25 * FISH_SCALE, 0, 0);
        ctx.fillStyle = "rgba(0, 180, 216, 0.2)";
        ctx.fill();
        ctx.stroke();
    } 
    else {
        // Struktur Duri Rusuk Tengah (Badan)
        const ribHeight = Math.sin((i / numSegments) * Math.PI) * 25 * FISH_SCALE;
        ctx.beginPath();
        ctx.moveTo(0, -ribHeight / 2);
        ctx.lineTo(0, ribHeight / 2);
        ctx.stroke();

        // Sirip Samping Dada (Diletakkan di dekat area kepala)
        if (i === 4) {
            ctx.beginPath();
            ctx.ellipse(-5 * FISH_SCALE, 0, 12 * FISH_SCALE, 28 * FISH_SCALE, 0.5, 0, Math.PI, true);
            ctx.fillStyle = "rgba(0, 180, 216, 0.15)";
            ctx.fill();
            ctx.stroke();
        }
    }
    ctx.restore();
}

// Meredam akselerasi kecepatan secara berkala kembali ke nol saat diam
pointer.velocityX *= 0.92;
pointer.velocityY *= 0.92;

// Mengulang render animasi pada frame berikutnya secara real-time
requestAnimationFrame(animate);
}

// Menjalankan game
animate();
