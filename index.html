<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport ini sangat penting agar skala layar di HP pas dan tidak bisa di-zoom tidak sengaja saat digeser -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Anglerfish (Mobile & Desktop)</title>
    <style>
        body {
            margin: 0;
            background-color: #050b14; /* Biru gelap kedalaman laut */
            overflow: hidden;
            cursor: none; /* Menyembunyikan kursor asli di laptop */
            /* Mencegah browser Android melakukan refresh halaman secara tidak sengaja saat layar ditarik ke bawah */
            overscroll-behavior: none; 
            touch-action: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <canvas id="fishCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // === KONFIGURASI UTAMA ===
        const FISH_SCALE = 1.2;
        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, velocityX: 0, velocityY: 0 };
        let lastTouchX = window.innerWidth / 2;
        let lastTouchY = window.innerHeight / 2;
        let biteTimer = 0;

        // Struktur Segmen Tulang Belakang (Inverse Kinematics)
        const numSegments = 18; 
        const segments = [];
        
        for (let i = 0; i < numSegments; i++) {
            segments.push({
                x: window.innerWidth / 2 + i * 15,
                y: window.innerHeight / 2,
                angle: 0,
                length: i === 0 ? 25 : 14 * FISH_SCALE
            });
        }

        // --- FUNGSI UPDATE POSISI & VELOCITY ---
        function handleMove(currentX, currentY) {
            pointer.velocityX = currentX - lastTouchX;
            pointer.velocityY = currentY - lastTouchY;
            lastTouchX = currentX;
            lastTouchY = currentY;

            if (Math.hypot(pointer.velocityX, pointer.velocityY) > 20) {
                biteTimer = 24;
            }
        }

        // 1. Dukungan Desktop (Mouse)
        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        // 2. Dukungan Android / Layar Sentuh (Touch Events)
        // Memicu pergerakan saat jari pertama kali menyentuh layar
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        }, { passive: true });

        // Memicu pergerakan saat jari digeser di atas layar
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });


        // --- LOOP UTAMA ANIMASI ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Redam kecepatan kursor perlahan ke posisi sentuhan/mouse asli
            pointer.x += (lastTouchX - pointer.x) * 0.12;
            pointer.y += (lastTouchY - pointer.y) * 0.12;

            const pointerSpeed = Math.hypot(pointer.velocityX, pointer.velocityY);
            const fastMovement = Math.min(Math.max(pointerSpeed - 12, 0) / 16, 1);
            const trailDistance = Math.min(pointerSpeed / 6, 1) * (34 + pointerSpeed * 0.22) * (1 - fastMovement * 0.55);

            if (biteTimer > 0) biteTimer--;

            // Proses Inverse Kinematics
            let targetX = pointer.x;
            let targetY = pointer.y;

            for (let i = 0; i < numSegments; i++) {
                const seg = segments[i];
                const dx = targetX - seg.x;
                const dy = targetY - seg.y;
                
                seg.angle = Math.atan2(dy, dx);
                seg.x = targetX - Math.cos(seg.angle) * seg.length;
                seg.y = targetY - Math.sin(seg.angle) * seg.length;

                targetX = seg.x;
                targetY = seg.y;
            }

            // --- PROSES RENDER VISUAL ---

            // Cahaya Lampu Anglerfish
            ctx.save();
            const glowGrd = ctx.createRadialGradient(pointer.x, pointer.y, 2, pointer.x, pointer.y, 160 + trailDistance * 2);
            glowGrd.addColorStop(0, 'rgba(0, 220, 255, 0.85)');
            glowGrd.addColorStop(0.1, 'rgba(0, 150, 255, 0.3)');
            glowGrd.addColorStop(0.5, 'rgba(0, 80, 150, 0.08)');
            glowGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Inti Lampu
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 6 * FISH_SCALE, 0, Math.PI * 2);
            ctx.fillStyle = "#e0f7fa";
            ctx.fill();

            // Gambar Badan dari Ekor ke Kepala
            for (let i = numSegments - 1; i >= 0; i--) {
                const seg = segments[i];
                ctx.save();
                ctx.translate(seg.x, seg.y);
                ctx.rotate(seg.angle);

                ctx.strokeStyle = "rgba(200, 240, 255, 0.45)";
                ctx.fillStyle = "rgba(10, 25, 40, 0.65)";
                ctx.lineWidth = 1.5;

                if (i === 0) {
                    // Antena Lampu
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(20, -30, 25 + trailDistance*0.2, -15);
                    ctx.strokeStyle = "rgba(0, 200, 255, 0.6)";
                    ctx.stroke();

                    // Rahang Atas
                    ctx.beginPath();
                    ctx.ellipse(5, -5, 20 * FISH_SCALE, 12 * FISH_SCALE, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Rahang Bawah
                    ctx.restore();
                    ctx.save();
                    ctx.translate(seg.x, seg.y);
                    const biteOpen = biteTimer > 0 ? 0.5 : (0.1 + pointerSpeed * 0.01);
                    ctx.rotate(seg.angle + biteOpen);
                    ctx.beginPath();
                    ctx.ellipse(5, 5, 22 * FISH_SCALE, 10 * FISH_SCALE, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Gigi
                    ctx.fillStyle = "rgba(230, 250, 255, 0.8)";
                    ctx.beginPath();
                    ctx.moveTo(12, 2); ctx.lineTo(15, 8); ctx.lineTo(17, 2);
                    ctx.moveTo(4, 1); ctx.lineTo(6, 7); ctx.lineTo(9, 1);
                    ctx.fill();
                } 
                else if (i === numSegments - 1) {
                    // Sirip Ekor
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-20, -25, -40, -35, -45, -15);
                    ctx.bezierCurveTo(-35, -5, -15, -2, 0, 0);
                    ctx.bezierCurveTo(-15, 2, -35, 5, -45, 15);
                    ctx.bezierCurveTo(-40, 35, -20, 25, 0, 0);
                    ctx.fillStyle = "rgba(0, 180, 216, 0.2)";
                    ctx.fill();
                    ctx.stroke();
                } 
                else {
                    // Duri Rusuk
                    const ribHeight = Math.sin((i / numSegments) * Math.PI) * 25 * FISH_SCALE;
                    ctx.beginPath();
                    ctx.moveTo(0, -ribHeight / 2);
                    ctx.lineTo(0, ribHeight / 2);
                    ctx.stroke();

                    if (i === 4) {
                        ctx.beginPath();
                        ctx.ellipse(-5, 0, 12 * FISH_SCALE, 28 * FISH_SCALE, 0.5, 0, Math.PI, true);
                        ctx.fillStyle = "rgba(0, 180, 216, 0.15)";
                        ctx.fill();
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            // Geser nilai kecepatan kembali ke nol jika sentuhan berhenti diam di tempat
            pointer.velocityX *= 0.92;
            pointer.velocityY *= 0.92;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
