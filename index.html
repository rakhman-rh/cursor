<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Anglerfish (Inverse Kinematics) - HD Version</title>
    <style>
        body {
            margin: 0;
            background-color: #050b14; /* Biru gelap kedalaman laut */
            overflow: hidden;
            cursor: none; /* Menyembunyikan kursor asli */
            overscroll-behavior: none; 
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;  /* Mengunci ukuran tampilan luar tetap seukuran layar */
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="fishCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');

        // === FITUR FIX HD (MENDETEKSI PERANGKAT HIGH-DPI / RETINA DISPLAY) ===
        function resize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Mendeteksi kerapatan piksel HP (biasanya bernilai 2x hingga 4x lipat dari laptop)
            const dpr = window.devicePixelRatio || 1; 
            
            // Mengalikan resolusi internal gambar di dalam Canvas agar menjadi HD
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            
            // Memaksa sistem Canvas mendeskalakan koordinat gambar kembali ke ukuran CSS normal
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // === KONFIGURASI KODE UTAMA ===
        const FISH_SCALE = 1.3;
        const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, velocityX: 0, velocityY: 0 };
        let lastMouseX = window.innerWidth / 2;
        let lastMouseY = window.innerHeight / 2;
        let biteTimer = 0;

        // Struktur Segmen Tulang Belakang (Inverse Kinematics)
        const numSegments = 18; 
        const segments = [];
        
        for (let i = 0; i < numSegments; i++) {
            segments.push({
                x: window.innerWidth / 2,
                y: window.innerHeight / 2,
                angle: 0,
                length: i === 0 ? 25 : 14 * FISH_SCALE
            });
        }

        // Fungsi Universal untuk Menangani Gerakan Mouse dan Sentuhan Jari
        function handleMove(currentX, currentY) {
            pointer.velocityX = currentX - lastMouseX;
            pointer.velocityY = currentY - lastMouseY;
            lastMouseX = currentX;
            lastMouseY = currentY;

            if (Math.hypot(pointer.velocityX, pointer.velocityY) > 25) {
                biteTimer = 24;
            }
        }

        // Melacak Gerakan Mouse (Desktop)
        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        // Melacak Sentuhan Jari (Chrome Android)
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Loop Utama Animasi
        function animate() {
            // Perhatikan ukuran pembersihan area sekarang menggunakan pembagi DPR agar tidak salah koordinat
            const dpr = window.devicePixelRatio || 1;
            ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

            // Redam kecepatan kursor perlahan ke posisi mouse asli
            pointer.x += (lastMouseX - pointer.x) * 0.12;
            pointer.y += (lastMouseY - pointer.y) * 0.12;

            const pointerSpeed = Math.hypot(pointer.velocityX, pointer.velocityY);
            const fastMovement = Math.min(Math.max(pointerSpeed - 12, 0) / 16, 1);
            const trailDistance = Math.min(pointerSpeed / 6, 1) * (34 + pointerSpeed * 0.22) * (1 - fastMovement * 0.55);

            if (biteTimer > 0) biteTimer--;

            // Kepala (Segmen 0) mengejar posisi pendaran lampu
            let targetX = pointer.x;
            let targetY = pointer.y;

            for (let i = 0; i < numSegments; i++) {
                const seg = segments[i];
                const dx = targetX - seg.x;
                const dy = targetY - seg.y;
                
                seg.angle = Math.atan2(dy, dx);
                seg.x = targetX - Math.cos(seg.angle) * seg.length;
                seg.y = targetY - Math.sin(seg.angle) * seg.length;

                targetX = seg.x;
                targetY = seg.y;
            }

            // --- PROSES MENGGAMBAR ---

            // 1. Efek Cahaya Lampu Anglerfish (Glow Effect)
            ctx.save();
            const glowGrd = ctx.createRadialGradient(pointer.x, pointer.y, 2, pointer.x, pointer.y, 180 + trailDistance * 2);
            glowGrd.addColorStop(0, 'rgba(0, 220, 255, 0.8)');
            glowGrd.addColorStop(0.1, 'rgba(0, 150, 255, 0.25)');
            glowGrd.addColorStop(0.5, 'rgba(0, 80, 150, 0.08)');
            glowGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrd;
            ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
            ctx.restore();

            // Titik Inti Lampu Kursor
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 6 * FISH_SCALE, 0, Math.PI * 2);
            ctx.fillStyle = "#e0f7fa";
            ctx.fill();

            // Menggambar seluruh struktur badan dari ekor ke kepala
            for (let i = numSegments - 1; i >= 0; i--) {
                const seg = segments[i];
                ctx.save();
                ctx.translate(seg.x, seg.y);
                ctx.rotate(seg.angle);

                ctx.strokeStyle = "rgba(200, 240, 255, 0.45)";
                ctx.fillStyle = "rgba(10, 25, 40, 0.6)";
                ctx.lineWidth = 1.5;

                if (i === 0) {
                    // Antena Lampu
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(20, -30, 25 + trailDistance*0.2, -15);
                    ctx.strokeStyle = "rgba(0, 200, 255, 0.6)";
                    ctx.stroke();

                    // Rahang Atas
                    ctx.beginPath();
                    ctx.ellipse(5, -5, 20 * FISH_SCALE, 12 * FISH_SCALE, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Rahang Bawah
                    ctx.restore();
                    ctx.save();
                    ctx.translate(seg.x, seg.y);
                    const biteOpen = biteTimer > 0 ? 0.6 : (0.1 + pointerSpeed * 0.01);
                    ctx.rotate(seg.angle + biteOpen);
                    ctx.beginPath();
                    ctx.ellipse(5, 5, 22 * FISH_SCALE, 10 * FISH_SCALE, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Gigi Tajam Transparan
                    ctx.fillStyle = "rgba(230, 250, 255, 0.8)";
                    ctx.beginPath();
                    ctx.moveTo(12, 2); ctx.lineTo(15, 8); ctx.lineTo(17, 2);
                    ctx.moveTo(4, 1); ctx.lineTo(6, 7); ctx.lineTo(9, 1);
                    ctx.fill();
                } 
                else if (i === numSegments - 1) {
                    // Sirip Ekor
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-20 * FISH_SCALE, -25 * FISH_SCALE, -40 * FISH_SCALE, -35 * FISH_SCALE, -45 * FISH_SCALE, -15 * FISH_SCALE);
                    ctx.bezierCurveTo(-35 * FISH_SCALE, -5 * FISH_SCALE, -15 * FISH_SCALE, -2 * FISH_SCALE, 0, 0);
                    ctx.bezierCurveTo(-15 * FISH_SCALE, 2 * FISH_SCALE, -35 * FISH_SCALE, 5 * FISH_SCALE, -45 * FISH_SCALE, 15 * FISH_SCALE);
                    ctx.bezierCurveTo(-40 * FISH_SCALE, 35 * FISH_SCALE, -20 * FISH_SCALE, 25 * FISH_SCALE, 0, 0);
                    ctx.fillStyle = "rgba(0, 180, 216, 0.2)";
                    ctx.fill();
                    ctx.stroke();
                } 
                else {
                    // Susunan Duri Ikan
                    const ribHeight = Math.sin((i / numSegments) * Math.PI) * 26 * FISH_SCALE;
                    
                    ctx.beginPath();
                    ctx.moveTo(0, -ribHeight / 2);
                    ctx.lineTo(0, ribHeight / 2);
                    ctx.stroke();

                    // Sirip Samping Dada
                    if (i === 4) {
                        ctx.beginPath();
                        ctx.ellipse(-5, 0, 12 * FISH_SCALE, 28 * FISH_SCALE, 0.5, 0, Math.PI, true);
                        ctx.fillStyle = "rgba(0, 180, 216, 0.15)";
                        ctx.fill();
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            pointer.velocityX *= 0.92;
            pointer.velocityY *= 0.92;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
